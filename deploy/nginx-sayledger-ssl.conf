# 由 deploy/enable-https.sh 在证书签发后自动生成替换，路径以实际证书为准
server {
    listen 443 ssl http2;
    server_name jizhang.clockwise.asia;

    ssl_certificate     /etc/nginx/ssl/jizhang.clockwise.asia/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/jizhang.clockwise.asia/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8421/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    root /opt/clockwise-ledger/frontend/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
